<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="css/phone.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-frame">
            <!-- Phone Notch -->
            <div class="phone-notch">
                <div class="notch-camera"></div>
                <div class="notch-speaker"></div>
            </div>
            
            <!-- Phone Screen -->
            <div class="phone-screen">
                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="status-left">
                        <span class="status-time" id="statusTime">9:41</span>
                    </div>
                    <div class="status-right">
                        <span class="status-signal">
                            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
                                <rect x="0" y="8" width="3" height="4" rx="0.5"/>
                                <rect x="4.5" y="5" width="3" height="7" rx="0.5"/>
                                <rect x="9" y="2" width="3" height="10" rx="0.5"/>
                                <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
                            </svg>
                        </span>
                        <span class="status-wifi">
                            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                                <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM8 5c2.5 0 4.8 1 6.5 2.6l-1.4 1.5C11.5 7.8 9.8 7 8 7s-3.5.8-5.1 2.1L1.5 7.6C3.2 6 5.5 5 8 5zm0-5c4 0 7.6 1.5 10.4 4l-1.5 1.5C14.5 3.2 11.4 2 8 2S1.5 3.2-.9 5.5L-2.4 4C.4 1.5 4 0 8 0z"/>
                            </svg>
                        </span>
                        <span class="status-battery">
                            <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor">
                                <rect x="0" y="0" width="22" height="12" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
                                <rect x="2" y="2" width="18" height="8" rx="1" fill="currentColor"/>
                                <path d="M23 4v4a2 2 0 000-4z"/>
                            </svg>
                        </span>
                    </div>
                </div>
                
                <!-- App Content Container -->
                <div class="app-content" id="app-content">
                    <!-- Views will be loaded here dynamically -->
                    <div class="placeholder-content">
                        <div class="placeholder-icon">💰</div>
                        <h1>Budget Tracker</h1>
                        <p>Phone frame ready!</p>
                    </div>
                </div>
            </div>
            
            <!-- Home Indicator -->
            <div class="phone-home-indicator">
                <div class="home-bar"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/view-handlers.js"></script>
</body>
</html>
