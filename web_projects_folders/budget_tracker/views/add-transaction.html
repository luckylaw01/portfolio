<div class="view add-transaction-view">
    <!-- Header -->
    <div class="view-header">
        <button class="back-btn">←</button>
        <h2 id="addTransactionTitle">Add Transaction</h2>
        <div class="header-spacer"></div>
    </div>

    <!-- Transaction Type Toggle -->
    <div class="type-toggle">
        <button class="type-btn active" data-type="expense" id="expenseTypeBtn">
            <span class="type-icon">↓</span>
            Expense
        </button>
        <button class="type-btn" data-type="income" id="incomeTypeBtn">
            <span class="type-icon">↑</span>
            Income
        </button>
    </div>

    <!-- Transaction Form -->
    <form id="transactionForm" class="transaction-form">
        <!-- Amount Input -->
        <div class="amount-input-container">
            <span class="currency-label">KSh</span>
            <input 
                type="number" 
                id="transactionAmount" 
                class="amount-input" 
                placeholder="0.00"
                step="0.01"
                min="0"
                required
            >
        </div>

        <!-- Category Selection -->
        <div class="form-group">
            <label class="form-label">Category</label>
            <div class="category-grid" id="categoryGrid">
                <!-- Categories will be loaded here -->
            </div>
        </div>

        <!-- Date Input -->
        <div class="form-group">
            <label class="form-label">Date</label>
            <input 
                type="date" 
                id="transactionDate" 
                class="form-input"
                required
            >
        </div>

        <!-- Description Input -->
        <div class="form-group">
            <label class="form-label">Description (optional)</label>
            <input 
                type="text" 
                id="transactionDescription" 
                class="form-input" 
                placeholder="Add a note..."
                maxlength="100"
            >
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="saveTransactionBtn">
            Save Transaction
        </button>
    </form>
</div>
