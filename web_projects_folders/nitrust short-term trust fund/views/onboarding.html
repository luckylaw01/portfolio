<div class="view onboarding-view">
    <div class="view-header">
        <h2>Create Account</h2>
    </div>
    <div class="view-content">
        <form id="signupForm" class="form">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="signupPhone" placeholder="07XX XXX XXX" required>
            </div>
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Create 4-Digit PIN</label>
                <input type="password" id="signupPin" maxlength="4" placeholder="****" required>
            </div>
            <div class="form-group">
                <label>Confirm PIN</label>
                <input type="password" id="signupPinConfirm" maxlength="4" placeholder="****" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
        <div class="form-footer">
            <p>Already have an account? <a href="#" id="goToLogin">Login</a></p>
        </div>
    </div>
</div>
