<div class="view signup-view">
    <div class="view-header">
        <button class="back-btn">←</button>
        <h2>Create your account</h2>
    </div>

    <div class="view-content">
        <div class="auth-container">
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="name" 
                        class="form-input" 
                        placeholder="Name"
                        autocomplete="name"
                        required
                    />
                </div>

                <div class="form-group">
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Username"
                        autocomplete="username"
                        required
                    />
                    <small class="form-hint">Only letters, numbers, and underscores</small>
                </div>

                <div class="form-group">
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="Email"
                        autocomplete="email"
                        required
                    />
                </div>

                <div class="form-group">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />
                    <small class="form-hint">Minimum 6 characters</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Sign up
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="#" id="loginLink" class="text-blue">Sign in</a></p>
            </div>
        </div>
    </div>
</div>

<style>
.signup-view .auth-container {
    padding: 20px;
}

.form-hint {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--x-gray);
}
</style>
