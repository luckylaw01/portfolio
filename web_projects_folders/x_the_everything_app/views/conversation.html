<div class="view conversation-view">
    <div class="view-header">
        <button class="back-btn">←</button>
        <div class="conversation-header-info">
            <h2 id="conversationName">User Name</h2>
            <p id="conversationUsername" style="font-size: 13px; color: var(--x-gray); font-weight: normal;">@username</p>
        </div>
    </div>

    <div class="view-content">
        <!-- Messages Container -->
        <div id="conversationMessages" class="conversation-messages">
            <!-- Messages will be loaded here -->
        </div>

        <!-- Message Input -->
        <div class="message-input-container">
            <textarea 
                id="messageInput" 
                class="message-input" 
                placeholder="Start a new message"
                rows="1"
            ></textarea>
            <button id="sendMessageBtn" class="send-btn">
                <span style="font-size: 20px;">➤</span>
            </button>
        </div>
    </div>
</div>

<style>
.conversation-header-info {
    flex: 1;
    text-align: center;
}

.conversation-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message-bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
}

.message-sent {
    align-self: flex-end;
    background: var(--x-blue);
    color: var(--x-white);
    border-radius: 18px 18px 4px 18px;
}

.message-received {
    align-self: flex-start;
    background: var(--x-dark-gray);
    color: var(--x-white);
    border-radius: 18px 18px 18px 4px;
}

.message-time {
    font-size: 11px;
    color: var(--x-gray);
    margin-top: 4px;
    text-align: right;
}

.message-sent .message-time {
    color: rgba(255, 255, 255, 0.7);
}

.message-input-container {
    position: sticky;
    bottom: 0;
    background: var(--x-black);
    border-top: 1px solid var(--x-border);
    padding: 12px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

.message-input {
    flex: 1;
    background: var(--x-dark-gray);
    border: 1px solid var(--x-border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--x-white);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    outline: none;
}

.message-input:focus {
    border-color: var(--x-blue);
}

.send-btn {
    width: 36px;
    height: 36px;
    background: var(--x-blue);
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
}

.send-btn:hover {
    background: #1A8CD8;
    transform: scale(1.05);
}

.send-btn:active {
    transform: scale(0.95);
}

.send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.conversation-empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--x-gray);
}
</style>
