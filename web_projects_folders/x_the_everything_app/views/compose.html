<div class="view compose-view">
    <div class="view-header">
        <button class="back-btn">✕</button>
        <h2>New post</h2>
    </div>

    <div class="view-content">
        <div class="compose-container">
            <form id="composeForm">
                <div class="compose-user">
                    <div class="post-avatar">👤</div>
                    <div class="compose-input-container">
                        <textarea 
                            id="postInput" 
                            class="compose-textarea" 
                            placeholder="What's happening?"
                            maxlength="280"
                            autofocus
                        ></textarea>
                    </div>
                </div>

                <div class="compose-footer">
                    <div class="compose-tools">
                        <button type="button" class="tool-btn" title="Add image">
                            🖼️
                        </button>
                        <button type="button" class="tool-btn" title="Add GIF">
                            GIF
                        </button>
                        <button type="button" class="tool-btn" title="Add poll">
                            📊
                        </button>
                        <button type="button" class="tool-btn" title="Add emoji">
                            😊
                        </button>
                    </div>
                    
                    <div class="compose-actions">
                        <span id="charCount" class="char-count">0/280</span>
                        <button type="submit" class="btn btn-primary">Post</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
