<div class="view profile-view">
    <div class="view-header">
        <button class="back-btn">←</button>
        <h2>Profile</h2>
        <button id="settingsBtn" class="settings-btn">⚙️</button>
    </div>

    <div class="view-content">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-cover">
                <!-- Cover image placeholder -->
            </div>
            <div class="profile-info-container">
                <div class="profile-avatar-container">
                    <div class="profile-avatar">👤</div>
                </div>
                <button class="btn btn-outline btn-edit-profile">Edit profile</button>
            </div>
        </div>

        <!-- Profile Details -->
        <div class="profile-details">
            <h1 id="profileName" class="profile-name">User Name</h1>
            <p id="profileUsername" class="profile-username">@username</p>
            <p id="profileBio" class="profile-bio">Bio goes here</p>
            
            <div class="profile-stats">
                <div class="stat-item">
                    <span id="followingCount" class="stat-number">0</span>
                    <span class="stat-label">Following</span>
                </div>
                <div class="stat-item">
                    <span id="followersCount" class="stat-number">0</span>
                    <span class="stat-label">Followers</span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="profile-tabs">
            <button class="tab-btn active" data-tab="posts">Posts</button>
            <button class="tab-btn" data-tab="replies">Replies</button>
            <button class="tab-btn" data-tab="media">Media</button>
            <button class="tab-btn" data-tab="likes">Likes</button>
        </div>

        <!-- User Posts -->
        <div id="userPostsContainer" class="feed-container">
            <!-- User posts will be loaded here -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item" data-view="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-view="explore">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">Explore</span>
        </button>
        <button class="nav-item" data-view="messages">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Messages</span>
        </button>
        <button class="nav-item" data-view="everything">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">Everything</span>
        </button>
        <button class="nav-item active" data-view="profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profile</span>
        </button>
    </div>
</div>
