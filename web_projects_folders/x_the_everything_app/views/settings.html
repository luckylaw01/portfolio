<div class="view settings-view">
    <div class="view-header">
        <button class="back-btn">←</button>
        <h2>Settings</h2>
    </div>

    <div class="view-content">
        <!-- Account Section -->
        <div class="settings-section">
            <div class="section-title">Account</div>
            <div class="settings-item" id="editProfileItem">
                <span>Edit Profile</span>
                <span class="arrow">›</span>
            </div>
            <div class="settings-item" id="changePasswordItem">
                <span>Change Password</span>
                <span class="arrow">›</span>
            </div>
            <div class="settings-item" id="privacySafetyItem">
                <span>Privacy & Safety</span>
                <span class="arrow">›</span>
            </div>
        </div>

        <!-- Preferences Section -->
        <div class="settings-section">
            <div class="section-title">Preferences</div>
            <div class="settings-item">
                <span>Notifications</span>
                <label class="toggle">
                    <input type="checkbox" id="notificationsToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="settings-item">
                <span>Dark Mode</span>
                <label class="toggle">
                    <input type="checkbox" id="darkModeToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <!-- About Section -->
        <div class="settings-section">
            <div class="section-title">About</div>
            <div class="settings-item" id="termsItem">
                <span>Terms of Service</span>
                <span class="arrow">›</span>
            </div>
            <div class="settings-item" id="privacyPolicyItem">
                <span>Privacy Policy</span>
                <span class="arrow">›</span>
            </div>
            <div class="settings-item" id="helpCenterItem">
                <span>Help Center</span>
                <span class="arrow">›</span>
            </div>
        </div>

        <!-- Logout Button -->
        <div class="settings-section">
            <button id="logoutBtn" class="btn btn-outline btn-block" style="color: var(--x-red); border-color: var(--x-red);">
                Logout
            </button>
        </div>
    </div>
</div>

<style>
.settings-section {
    margin-bottom: 24px;
}

.section-title {
    padding: 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--x-gray);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.settings-item {
    padding: 16px;
    border-bottom: 1px solid var(--x-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s;
}

.settings-item:hover {
    background: var(--x-hover);
}

.arrow {
    color: var(--x-gray);
    font-size: 20px;
}

/* Toggle Switch */
.toggle {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
}

.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: var(--x-gray);
    transition: 0.3s;
    border-radius: 24px;
}

.toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}

.toggle input:checked + .toggle-slider {
    background-color: var(--x-blue);
}

.toggle input:checked + .toggle-slider:before {
    transform: translateX(20px);
}
</style>
