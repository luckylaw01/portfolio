<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X - The Everything App</title>
    <link rel="stylesheet" href="css/phone.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-frame">
            <!-- Phone Notch -->
            <div class="phone-notch"></div>
            
            <!-- Phone Screen -->
            <div class="phone-screen">
                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="status-left">
                        <span class="time" id="statusTime">9:41</span>
                    </div>
                    <div class="status-right">
                        <span class="status-icon">📶</span>
                        <span class="status-icon">📡</span>
                        <span class="status-icon">🔋</span>
                    </div>
                </div>
                
                <!-- App Content Area -->
                <div class="app-content" id="app-content">
                    <!-- Views will be loaded here dynamically -->
                </div>
            </div>
            
            <!-- Home Indicator -->
            <div class="phone-home-indicator"></div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/view-handlers-2.js"></script>
    <script src="js/view-handlers.js"></script>
    <script src="js/view-handlers-payments.js"></script>
    <script src="js/view-handlers-bank.js"></script>
    <script src="js/view-handlers-jobs.js"></script>
    <script src="js/view-handlers-events.js"></script>
    <script src="js/view-handlers-food.js"></script>
    <script src="js/view-handlers-rides.js"></script>
    <script src="js/view-handlers-news.js"></script>
    <script src="js/view-handlers-government.js"></script>
    <script src="js/view-handlers-video.js"></script>
    <script src="js/sample-data.js"></script>
</body>
</html>
