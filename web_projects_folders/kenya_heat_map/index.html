            { name: "Kisumu VTC", lat: -0.0917, lng: 34.7583, county: "Kisumu", type: "VTC" },
            { name: "Nakuru VTC", lat: -0.3000, lng: 36.0833, county: "Nakuru", type: "VTC" },
            { name: "Eldoret VTC", lat: 0.5000, lng: 35.2667, county: "Uasin Gishu", type: "VTC" },
            { name: "Nyeri VTC", lat: -0.4333, lng: 36.9667, county: "Nyeri", type: "VTC" },
            { name: "Meru VTC", lat: 0.0333, lng: 37.6500, county: "Meru", type: "VTC" },
            { name: "Kakamega VTC", lat: 0.2833, lng: 34.7500, county: "Kakamega", type: "VTC" },
            { name: "Kisii VTC", lat: -0.6833, lng: 34.7833, county: "Kisii", type: "VTC" },
            { name: "Embu VTC", lat: -0.5500, lng: 37.4667, county: "Embu", type: "VTC" },
            { name: "Machakos VTC", lat: -1.5000, lng: 37.2500, county: "Machakos", type: "VTC" },
            { name: "Kitui VTC", lat: -1.3667, lng: 38.0167, county: "Kitui", type: "VTC" },
            { name: "Kilifi VTC", lat: -3.6333, lng: 39.8500, county: "Kilifi", type: "VTC" },
            { name: "Thika VTC", lat: -1.0333, lng: 37.0833, county: "Kiambu", type: "VTC" },
            { name: "Naivasha VTC", lat: -0.7167, lng: 36.4500, county: "Nakuru", type: "VTC" }
        ];

        // Create custom icons
        const universityIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="background:#E74C3C;width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:bold;">🏛</div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        const tvetIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="background:#3498DB;width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:bold;">🔧</div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });

        // Create layer groups
        const universityMarkers = L.layerGroup();
        const tvetMarkers = L.layerGroup();

        // Add university markers
        universities.forEach(uni => {
            const marker = L.marker([uni.lat, uni.lng], { icon: universityIcon })
                .bindPopup(`
                    <div class="popup-title">${uni.name}</div>
                    <span class="popup-type university">${uni.type} University</span>
                    <div class="popup-location">📍 ${uni.county} County</div>
                `);
            universityMarkers.addLayer(marker);
        });

        // Add TVET markers
        tvetInstitutions.forEach(tvet => {
            const marker = L.marker([tvet.lat, tvet.lng], { icon: tvetIcon })
                .bindPopup(`
                    <div class="popup-title">${tvet.name}</div>
                    <span class="popup-type tvet">${tvet.type}</span>
                    <div class="popup-location">📍 ${tvet.county} County</div>
                `);
            tvetMarkers.addLayer(marker);
        });

        // Add layers to map
        universityMarkers.addTo(map);
        tvetMarkers.addTo(map);

        // Create heatmap data
        const heatData = [
            ...universities.map(u => [u.lat, u.lng, 0.8]),
            ...tvetInstitutions.map(t => [t.lat, t.lng, 0.5])
        ];

        // Create heat layer
        const heatLayer = L.heatLayer(heatData, {
            radius: 30,
            blur: 20,
            maxZoom: 10,
            max: 1.0,
            gradient: {
                0.2: '#2ECC71',
                0.4: '#F1C40F',
                0.6: '#E67E22',
                0.8: '#E74C3C',
                1.0: '#9B59B6'
            }
        });

        let heatmapVisible = false;

        // Control functions
        function showAll() {
            universityMarkers.addTo(map);
            tvetMarkers.addTo(map);
            updateButtons('all');
        }

        function showUniversities() {
            map.removeLayer(tvetMarkers);
            universityMarkers.addTo(map);
            updateButtons('university');
        }

        function showTVET() {
            map.removeLayer(universityMarkers);
            tvetMarkers.addTo(map);
            updateButtons('tvet');
        }

        function toggleHeatmap() {
            if (heatmapVisible) {
                map.removeLayer(heatLayer);
                heatmapVisible = false;
                document.querySelector('.btn-heatmap').classList.remove('active');
            } else {
                heatLayer.addTo(map);
                heatmapVisible = true;
                document.querySelector('.btn-heatmap').classList.add('active');
            }
        }

        function updateButtons(active) {
            document.querySelectorAll('.control-btn').forEach(btn => {
                if (!btn.classList.contains('btn-heatmap')) {
                    btn.classList.remove('active');
                }
            });
            if (active === 'all') document.querySelector('.btn-all').classList.add('active');
            if (active === 'university') document.querySelector('.btn-university').classList.add('active');
            if (active === 'tvet') document.querySelector('.btn-tvet').classList.add('active');
        }

        // Info control
        const info = L.control({ position: 'topright' });

        info.onAdd = function(map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };

        info.update = function() {
            const counties = new Set([
                ...universities.map(u => u.county),
                ...tvetInstitutions.map(t => t.county)
            ]);
            
            this._div.innerHTML = `
                <h4>📊 LMS Market Overview</h4>
                <div class="stats">
                    <div class="stat-item uni">
                        <span class="stat-number">${universities.length}</span>
                        <span class="stat-label">Universities</span>
                    </div>
                    <div class="stat-item tvet">
                        <span class="stat-number">${tvetInstitutions.length}</span>
                        <span class="stat-label">TVET Institutions</span>
                    </div>
                </div>
                <p style="margin-top:10px;font-size:11px;color:#666;">
                    🎯 Total: <strong>${universities.length + tvetInstitutions.length}</strong> institutions<br>
                    🗺️ Coverage: <strong>${counties.size}</strong> counties
                </p>
            `;
        };

        info.addTo(map);

        // Add legend
        const legend = L.control({ position: 'bottomright' });

        legend.onAdd = function(map) {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Legend</h4>
                <div class="legend-item">
                    <div class="legend-icon" style="background:#E74C3C;">🏛</div>
                    <span>University</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon" style="background:#3498DB;">🔧</div>
                    <span>TVET Institution</span>
                </div>
                <div class="legend-item" style="margin-top:10px;">
                    <div style="width:60px;height:10px;background:linear-gradient(to right,#2ECC71,#F1C40F,#E67E22,#E74C3C,#9B59B6);border-radius:3px;margin-right:8px;"></div>
                    <span style="font-size:11px;">Density</span>
                </div>
            `;
            return div;
        };

        legend.addTo(map);

        // Update stats panel
        const counties = new Set([
            ...universities.map(u => u.county),
            ...tvetInstitutions.map(t => t.county)
        ]);
        
        document.getElementById('total-institutions').textContent = universities.length + tvetInstitutions.length;
        document.getElementById('total-universities').textContent = universities.length;
        document.getElementById('total-tvet').textContent = tvetInstitutions.length;
        document.getElementById('total-counties').textContent = counties.size;
    </script>
</body>
</html>
